datastore:
  kind: mdp
  config_path: danra.datastore.yaml
datastore_boundary:
  kind: mdp
  config_path: era5.datastore.yaml
  variable_mapping:
    "u100m": "u_component_of_wind1000hPa"
    "v100m": "v_component_of_wind1000hPa"
training:
  state_feature_weighting:
    __config_class__: ManualStateFeatureWeighting
    weights:
      u100m: 1.0
      v100m: 1.0
