datastores:
  interior:
    kind: mdp
    config_path: danra.datastore.yaml
    outputs:
      state:  # all state vars are prognostic outputs
  boundary:
    kind: mdp
    config_path: era5.datastore.yaml
    # no `outputs:` declared, so this datastore is input-only
training:
  state_feature_weighting:
    __config_class__: ManualStateFeatureWeighting
    weights:
      u100m: 1.0
      v100m: 1.0
